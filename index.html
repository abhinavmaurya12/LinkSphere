const FAQ=[['Getting started',[
['What is LinkSphere?','LinkSphere is a LinkedIn-style professional networking app that runs entirely in your browser. You can build a profile, connect with people, post updates, find jobs and chat. It is a demo project and is not affiliated with LinkedIn.'],
['How do I create an account?','On the sign-in page choose “Join now”, enter your full name, an email and a password of at least 6 characters, then press “Agree & Join”.'],
['I forgot my password. What can I do?','Accounts are stored only in this browser, so there is no email reset. You can create a new account with a different email. The old account stays saved in this browser as long as you do not clear site data.'],
['How do I sign out?','Open the “Me” menu at the top and choose “Sign out”. On a phone, tap your photo at the top left and choose “Sign out”.']]],
['Profile',[
['How do I edit my profile?','Open Me → View profile. Use the pencil icon next to your name to edit your intro (name, headline, location) and contact info. Use “Add profile section” to add experience, education, skills, certifications, projects and more.'],
['How do I change my photo or cover image?','On your profile, tap the camera icon on your photo or on the cover banner and choose an image from your device. You can remove them from the “Enhance profile” menu.'],
['What does “Open to work” do?','Open to → Finding a new job lets you set the job titles, workplace types and start date you want, and choose whether only recruiters or all members can see it. You can turn it off any time.'],
['Can I save my profile as a PDF?','Yes. On your profile open Resources → Save profile as PDF, then choose “Save as PDF” in the print window. The Resume Builder (Me menu) also makes a printable resume from your profile.']]],
['My Network',[
['How do I connect with someone?','Open My Network and press “+ Connect” on a person, or open their profile and press Connect. In this demo most invitations are accepted within a few seconds.'],
['What is the difference between Connect and Follow?','Connecting adds a person to your network so you can message them. Following only puts their posts in your feed; people and company pages can be followed without connecting.'],
['How do I accept, ignore or withdraw invitations?','My Network → Manage shows Received and Sent invitations. Press Accept or Ignore on received ones, and Withdraw on ones you sent.'],
['How do I remove a connection?','My Network → Manage my network → Connections, then press Remove next to the person.'],
['What is “Catch up”?','Catch up (My Network → Catch up) shows birthdays, work anniversaries, job changes and new certifications. Press the action button to send a short congratulation message.']]],
['Posts and feed',[
['How do I create a post?','On the Home page press “Start a post”, write your text, optionally add a photo, and press Post. You can also create a poll or write an article from the same card.'],
['How do I edit or delete my post?','Press the ⋯ menu at the top right of your post and choose Edit post or Delete post.'],
['How do reactions work?','Hover over Like on a computer, or tap the small ▾ arrow on a phone, to pick Like, Celebrate, Support, Insightful or Funny. Press the button again to remove your reaction.'],
['What do Repost and Send do?','Repost shares a post to your feed instantly or with your own thoughts added. Send shares it with one of your conversations as a private message.'],
['How do I save a post for later?','Use the ⋯ menu on the post and choose Save. Saved posts appear under Saved items.']]],
['Jobs',[
['How do I apply for a job?','Open the Jobs tab and press “Easy Apply” on a job. Enter your phone number and an optional note to the recruiter, then submit. You can withdraw the application later from the same job card.'],
['How do I keep track of my applications?','Open Me → Job tracker. Jobs you save or apply to appear there, and you can move each one between Saved, Applied, Interviewing, Offer and Rejected.'],
['How do I set a job alert?','On the Jobs tab press “+ Create alert”, enter a keyword such as java, remote or intern, and you will see the matching jobs and get notified.'],
['Can I post a job?','Yes. On the Jobs tab press “+ Post a job”, fill in the title, company, workplace type, location, salary and description. The job then appears in the Jobs list.'],
['What is the Cover letter writer?','Open Me → Cover letter writer, pick a job, and a draft is generated from your headline, skills and summary. You can edit it and copy it.']]],
['Messaging',[
['How do I send a message?','Open Messaging and pick a conversation, or press the pencil icon to start a new message with one of your connections. You can also press Message on a profile.'],
['Can I star or delete conversations?','Yes. Use the ☆ icon at the top of a conversation to star it, and the 🗑 icon to delete it. Hover over one of your own messages and press ✕ to delete just that message.'],
['Why do I get automatic replies?','This is a demo, so other members are simulated and reply automatically with short messages.']]],
['Privacy and data',[
['Where is my data stored?','Only in this browser on this device (local storage). Nothing is sent to a server, so clearing your browser data removes your account and posts.'],
['How can I download or delete my data?','Settings & Privacy → Data → Download saves a copy of your data as a file. To delete everything, clear this site’s data in your browser settings.'],
